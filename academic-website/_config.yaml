title: Joshua B. Evans
description: Joshua B. Evans is a lecturer at the University of Bath, where his research focuses on hierarchical reinforcement learning, skill discovery, and other aspects of artificial intelligence and machine learning.
image: /assets/images/profile_pic.png

# No theme (use own layouts and styles).
#theme: none

# Plugins list.
plugins:
  - jekyll-feed
  - jekyll-last-modified-at
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge

# Build settings.
sass:
  style: compressed

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
  - scope: { path: "", type: "pages" }
    values:
      layout: page
  # Keep shared papers accessible without listing them in the sitemap.
  - scope: { path: "assets/papers" }
    values:
      sitemap: false

# Shared identity.
author:
  name: Joshua B. Evans
  affiliation: University of Bath
  affiliation_url: https://www.bath.ac.uk/
  job_title: Lecturer in Computer Science and Artificial Intelligence
  email: jbe25@bath.ac.uk
  professional_email: jbevans.cs@gmail.com
  lab_name: Bath Reinforcement Learning Laboratory
  lab_url: https://bathrllab.github.io/

exclude:
  - _site
  - _site_dev
  - serve.ps1
  - build.ps1
  - check.ps1
  - scripts
  - README.md
