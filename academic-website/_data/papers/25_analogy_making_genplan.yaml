title: Structural Analogies as Posterior Transfer in Continual Reinforcement Learning (GenPlan 2026)
date: 2026-05-30
description: We use graph matching to identify recurring structure and transfer knowledge between similar regions of an environment in continual reinforcement learning. We show when these analogies improve learning, balancing the benefit of reusing past experience against errors caused by imperfect structural matches.
