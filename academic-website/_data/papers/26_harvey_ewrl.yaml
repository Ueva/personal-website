title: Graph-Based Skill Discovery in Continuous State Spaces via Temporal Distance Clustering (EWRL 2026)
type: workshop
date: 2026-10-03
description: We present an approach for constructing abstract transition graphs by clustering states within a temporal distance embedding space. This approach enables the application of any graph-based skill discovery method to environments with continuous state spaces.
