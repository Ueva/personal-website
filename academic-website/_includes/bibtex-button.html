{% if include.paper.bibtex %}
<span class="bibtex-copy">
    <button class="button" type="button" data-copy-bibtex aria-label="Copy BibTeX for {{ include.paper.title | escape }}">BibTeX »</button>
    <span class="small" role="status" data-bibtex-status></span>
    <textarea hidden readonly rows="8" cols="60" aria-label="BibTeX citation for {{ include.paper.title | escape }}" data-bibtex-source>{{ include.paper.bibtex | escape }}</textarea>
</span>
{% endif %}
