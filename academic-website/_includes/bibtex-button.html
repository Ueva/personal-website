{% if include.paper.bibtex %}
<div class="bibtex-copy">
    <button class="button" type="button" data-copy-bibtex aria-label="Copy BibTeX for {{ include.paper.title | escape }}" hidden>BibTeX &raquo;</button>
    <span class="small" role="status" data-bibtex-status></span>
    <details class="bibtex-fallback">
        <summary class="button">BibTeX &raquo;</summary>
        <textarea readonly rows="8" aria-label="BibTeX citation for {{ include.paper.title | escape }}" data-bibtex-source>{{ include.paper.bibtex | escape }}</textarea>
    </details>
</div>
{% endif %}
