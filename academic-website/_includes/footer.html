<footer class="site-footer">
    <div class="container">
        <p>
            {% assign profiles = site.data.profiles | where: 'footer', true %}
            {% for profile in profiles %}
            <a href="{{ profile.url | escape }}" target="_blank" rel="noopener">{{ profile.label | escape }}</a>{% unless forloop.last %} &middot; {% endunless %}
            {% endfor %}
        </p>
        <p class="small">&copy; {{ site.time | date: '%Y' }} {{ site.author.name | escape }}</p>
    </div>
</footer>
