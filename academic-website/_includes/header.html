<header class="site-header">
    <div class="container nav-wrap">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <button class="button nav-toggle" type="button" aria-label="Toggle site menu" aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav id="site-nav" class="site-nav" aria-label="Primary">
            <ul>
                {% assign nav_pages = site.pages | where_exp: 'p', 'p.nav_order' | sort: 'nav_order' %}
                {% for p in nav_pages %}
                <li><a href="{{ p.url | relative_url }}"{% if p.url == page.url %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title | escape }}</a></li>
                {% endfor %}
            </ul>
        </nav>
        <button id="theme-toggle" class="button" type="button" hidden>Auto</button>
    </div>
</header>

<script>{% include header-controls.js %}</script>
